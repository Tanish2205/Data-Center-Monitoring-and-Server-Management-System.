<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark navbar-expand-md mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">Data Center Monitor</a>
        <div class="navbar-nav ms-3 flex-row gap-3">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
            <a class="nav-link {% if request.path.startswith('/servers') %}active{% endif %}" href="{{ url_for('servers') }}">Servers</a>
            <a class="nav-link {% if request.path.startswith('/users') %}active{% endif %}" href="{{ url_for('users') }}">Users</a>
            <a class="nav-link {% if request.path == '/alerts' %}active{% endif %}" href="{{ url_for('alerts') }}">Alerts</a>
            <a class="nav-link {% if request.path == '/logs' %}active{% endif %}" href="{{ url_for('logs') }}">Activity Log</a>
        </div>
        <div class="ms-auto d-flex align-items-center gap-3">
            {% if session.username %}
            <span class="text-light small">Logged in as {{ session.username }}</span>
            <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container-fluid px-4 pb-5">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
